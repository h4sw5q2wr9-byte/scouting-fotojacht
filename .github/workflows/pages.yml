name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify app, library and social preview
        run: node scripts/verify.mjs
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - name: Prepare static site
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir _site
          cp index.html styles.css app.js challenges.js manifest.webmanifest sw.js credits.html README.md _site/
          cp -R assets vendor archive _site/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
      - id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
